<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Bloom baby kids · Acesso administrativo</title>
<style>
  :root { font-family: Nunito, Arial, sans-serif; color: #28212c; background: #fff9e8; }
  * { box-sizing: border-box; }
  body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top left, #ffe3c2, transparent 40%), #fff9e8; }
  main { width: min(100%, 420px); padding: 32px; background: #fff; border: 1px solid #eadfd3; border-radius: 18px; box-shadow: 0 18px 50px #6f4e3218; }
  h1 { margin: 0 0 8px; font-size: 27px; }
  p { margin: 0 0 24px; color: #746873; }
  label { display: block; margin-bottom: 8px; font-weight: 800; }
  input { width: 100%; padding: 13px 14px; border: 1px solid #d8c9bd; border-radius: 10px; font: inherit; }
  button { width: 100%; margin-top: 16px; padding: 13px 16px; border: 0; border-radius: 10px; color: #fff; background: #e8793f; font: inherit; font-weight: 800; cursor: pointer; }
  .erro { min-height: 22px; margin-top: 12px; color: #b44032; font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>Área administrativa</h1>
  <p>Entre com seus dados para gerenciar o catálogo.</p>
  <form id="loginForm">
    <label for="usuario">Usuário</label>
    <input id="usuario" type="text" autocomplete="username" required autofocus>
    <label for="senha" style="margin-top: 16px">Senha</label>
    <input id="senha" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Entrar</button>
    <div class="erro" id="erro" role="alert"></div>
  </form>
</main>
<script>
  const form = document.getElementById('loginForm');
  const erro = document.getElementById('erro');
  form.addEventListener('submit', async event => {
    event.preventDefault();
    erro.textContent = '';
    try {
      const resposta = await fetch('api/auth.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          usuario: document.getElementById('usuario').value,
          senha: document.getElementById('senha').value
        })
      });
      const dados = await resposta.json();
      if (!resposta.ok) throw new Error(dados.erro || 'Não foi possível entrar.');
      window.location.replace('bloom-painel.html');
    } catch (error) {
      erro.textContent = error.message;
    }
  });
</script>
</body>
</html>
